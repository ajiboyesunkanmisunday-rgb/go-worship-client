# Public nginx routing for the Next.js frontend.
#
# The backend routes stay exactly as they are — keep these pointing at the API:
#   location /api/         { proxy_pass http://go-worship-api:8585; ... }
#   location /oauth2/      { proxy_pass http://go-worship-api:8585; ... }
#   location /.well-known/ { proxy_pass http://go-worship-api:8585; ... }
#
# Everything else (the UI AND our /bff/* proxy routes) goes to the Next.js
# server. Note the port is 3000 (a Node server), NOT :80 — the guide's :80 was
# for an nginx-static SPA, which this is not. Our /bff/* is intentionally not
# under /api/*, so the /api/ rule above does not hijack it.

location / {
    proxy_pass         http://go-worship-web:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
