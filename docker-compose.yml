services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_USE_LIVE_API: "${NEXT_PUBLIC_USE_LIVE_API:-true}"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_TENANT_ID: "${API_TENANT_ID}"
      LOGIN_HMAC_SECRET: "${LOGIN_HMAC_SECRET}"
    env_file:
      - .env.local
    restart: unless-stopped
