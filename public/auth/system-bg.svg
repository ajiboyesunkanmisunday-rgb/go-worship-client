<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" fill="none">
  <rect width="800" height="900" fill="#1A2E6F"/>
  <!-- Large outer triangle -->
  <polygon points="400,60 760,720 40,720" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Inner triangle 1 -->
  <polygon points="400,160 660,640 140,640" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.2"/>
  <!-- Inner triangle 2 -->
  <polygon points="400,260 560,560 240,560" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Inverted overlay triangle -->
  <polygon points="400,720 100,200 700,200" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.2"/>
  <!-- Side accent triangles -->
  <polygon points="80,100 250,420 -90,420" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <polygon points="720,100 890,420 550,420" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
