<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Go Worship role-aware dashboard">
  <title>Dashboard | Go Worship</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c468e'/%3E%3Cpath d='M15 22h34v20H15z' fill='white'/%3E%3Cpath d='M21 28h22v8H21z' fill='%23f4b942'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="dashboard.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
<a class="skip-link" href="#dashboard-main">Skip to dashboard</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Dashboard families">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Go Worship</span></div>
    <nav id="family-nav" class="family-nav" aria-label="Available dashboard views"></nav>
    <button id="collapse-sidebar" class="sidebar-collapse" type="button" aria-expanded="true">
      <span aria-hidden="true">‹</span><span class="nav-label">Collapse</span>
    </button>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button id="mobile-menu" class="icon-button mobile-menu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="context-title">
        <strong id="tenant-name">Dashboard</strong>
        <span id="scope-label">Authorized view</span>
      </div>
      <div class="topbar-actions">
        <button id="refresh-dashboard" class="icon-button" type="button" aria-label="Refresh dashboard">↻</button>
        <div class="user-chip"><span id="user-initials" aria-hidden="true">GW</span><div><strong id="user-name">Loading…</strong><small id="access-mode">Read only</small></div></div>
      </div>
    </header>

    <main id="dashboard-main" class="dashboard-main" tabindex="-1">
      <section class="page-heading">
        <div><p class="eyebrow" id="family-eyebrow">Dashboard</p><h1 id="dashboard-title">Overview</h1><p id="dashboard-description">Loading your authorized analysis…</p></div>
        <button id="toggle-filters" class="secondary-button" type="button" aria-expanded="false" aria-controls="dashboard-filters">Filters</button>
      </section>

      <form id="dashboard-filters" class="filter-panel" hidden>
        <label>Period<select id="period"><option value="LAST_30_DAYS" selected>Last 30 days</option><option value="CUSTOM">Custom range</option></select></label>
        <label>Granularity<select id="granularity"><option value="">Automatic</option><option>HOUR</option><option>DAY</option><option>WEEK</option><option>MONTH</option><option>QUARTER</option><option>YEAR</option></select></label>
        <label>Dimension<select id="dimension">
          <option value="">Backend default</option>
          <optgroup label="Time"><option>NONE</option><option>TIME</option><option>HOUR</option><option>DAY</option><option>WEEK</option><option>MONTH</option><option>QUARTER</option><option>YEAR</option></optgroup>
          <optgroup label="Account hierarchy"><option>TENANT</option><option>CAMPUS</option><option>USER_TYPE</option><option>ROLE</option></optgroup>
          <optgroup label="Financial"><option>CURRENCY</option><option>PAYMENT_STATUS</option><option>PAYMENT_SOURCE</option><option>PAYMENT_GATEWAY</option><option>DONATION_STATUS</option><option>DONATION_SOURCE</option><option>FUND</option><option>FUND_TYPE</option><option>RECURRING_FREQUENCY</option></optgroup>
          <optgroup label="Subscription"><option>SUBSCRIPTION_PLAN</option><option>SUBSCRIPTION_STATUS</option><option>ACCESS_MODE</option></optgroup>
          <optgroup label="Engagement"><option>EVENT</option><option>EVENT_TYPE</option><option>REGISTRATION_STATUS</option><option>ATTENDANCE_STATUS</option><option>VISITOR_FOLLOW_UP_STATUS</option></optgroup>
          <optgroup label="Content"><option>SERMON_STATUS</option><option>SERMON_VISIBILITY</option><option>SERMON_SERIES</option></optgroup>
          <optgroup label="Communication"><option>MESSAGE_CHANNEL</option><option>MESSAGE_STATUS</option><option>NOTIFICATION_CHANNEL</option><option>NOTIFICATION_STATUS</option><option>CAMPAIGN_STATUS</option></optgroup>
          <optgroup label="Security"><option>AUTHENTICATION_METHOD</option><option>AUTHENTICATION_OUTCOME</option><option>SESSION_STATUS</option><option>RISK_LEVEL</option><option>MFA_METHOD</option><option>AUDIT_ACTION</option><option>AUDIT_RESOURCE</option><option>AUDIT_OUTCOME</option></optgroup>
        </select></label>
        <label>Currency<input id="currency" inputmode="text" maxlength="3" pattern="[A-Za-z]{3}" placeholder="USD"></label>
        <label id="campus-filter" hidden>Campus ID<input id="campus-id" maxlength="26" autocomplete="off"></label>
        <label>Timezone<input id="zone-id" maxlength="80" value="UTC"></label>
        <label class="custom-range" hidden>From<input id="from" type="datetime-local"></label>
        <label class="custom-range" hidden>To<input id="to" type="datetime-local"></label>
        <div class="filter-actions"><button class="primary-button" type="submit">Apply</button><button id="reset-filters" class="secondary-button" type="button">Reset</button></div>
      </form>

      <div id="dashboard-status" class="status" role="status" aria-live="polite"></div>
      <section id="alerts" class="alerts" aria-label="Dashboard alerts"></section>
      <section id="metric-grid" class="metric-grid" aria-label="Summary metrics"></section>
      <section id="section-grid" class="section-grid" aria-label="Dashboard analysis"></section>
      <p class="generated-at" id="generated-at"></p>
    </main>
  </div>
</div>
<template id="loading-template"><div class="skeleton card"></div><div class="skeleton card"></div><div class="skeleton card"></div></template>
</body>
</html>
