<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Link & QR | Go-Worship</title><link rel="stylesheet" href="qr.css"><script src="qr.js" defer></script></head><body><main class="card"><header><span>∞</span><p class="eyebrow">Go-Worship</p><h1>Payment link & QR</h1><p>Create a shareable church giving entry point without exposing tenant IDs.</p></header><div id="notice" role="status"></div><form id="form"><label>Checkout URL<input id="checkout-url" type="url" required placeholder="https://church.example/tools/checkout/"></label><label>Label<input id="label" maxlength="120" value="Give securely"></label><button type="submit">Prepare QR code</button></form><section id="result" hidden><div class="qr-frame"><img id="qr-image" alt="Payment checkout QR code"></div><h2 id="qr-label"></h2><a id="link" target="_blank" rel="noopener">Open secure checkout</a><div class="actions"><button id="copy">Copy link</button><button id="download">Download QR</button><button id="print">Print</button></div><p class="powered">Payments securely powered by <b>Leadremit</b></p></section></main></body></html>
