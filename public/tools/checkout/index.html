<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Secure Giving Checkout</title><link rel="stylesheet" href="checkout.css"><script src="checkout.js" defer></script></head><body><main class="embed"><aside class="message"><div id="brand-logo" class="brand">∞</div><div><h1>Grace flows<br>through generosity</h1><p>“Give, and it will be given to you.”</p></div><small>Secure checkout</small></aside><section class="form-card"><header><div class="mark">∞</div><h2 id="tenant">Giving Platform</h2><p>A generous person will prosper; whoever refreshes others will be refreshed.</p></header><div id="notice" class="notice" role="status"></div><form id="form"><label>Donor details<select id="donor-type"><option value="GUEST">Guest</option><option value="MEMBER">Member</option></select></label><label>Full name<input id="name" maxlength="160" autocomplete="name" required></label><label>Email address<input id="email" type="email" maxlength="254" autocomplete="email" required></label><div class="row"><label>Currency<select id="currency"><option>USD</option></select></label><label>Amount<input id="amount" type="number" min="0.01" step="0.01" required></label></div><label>Campus<select id="campus" required><option value="">Select a campus</option></select></label><label>Purpose of giving<select id="fund" required><option value="">Select a purpose</option></select></label><button id="pay" type="submit">Give generously</button></form><section id="result" hidden><div class="success">✓</div><h2 id="result-title">Confirming payment</h2><p id="result-status"></p><p class="reference" id="reference"></p><button id="again">Make another gift</button></section><footer>Powered by <b>Leadremit</b></footer></section></main></body></html>
